[package]
name = "claude-profiles"
version = "0.1.0"
edition = "2021"
description = "Gestor de perfiles para Claude Desktop y Claude Code"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

[profile.release]
opt-level = "s"
lto = true
strip = true
